cde:
  short: "CDE"
  long: "cloud development environment"
  description: "An on-demand, pre-configured development environment that runs in the cloud."

bazel:
  short: "Bazel"
  description: "A build system built by Google to create scalable monorepos."

monorepo:
  short: "monorepo"
  description: "A source code repository that holds multiple distinct projects that can form source code dependencies on each other, as well as core libraries."

kubernetes:
  short: "Kubernetes"
  description: "An orchestration system for containerised applications. https://kubernetes.io/"

pd:
  short: "PD"
  long: "Persistent Disk"
  description: "A form of network-attached block storage that can be attached to virtual machines on the Google Cloud Compute platform."

hd:
  short: "HD"
  long: "Hyperdisk"
  description: "Similar to a Persistent Disk, a form of network-attached block storage with certain fundamental differences."